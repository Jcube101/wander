# Copy to wrangler.toml (gitignored) and use your own values. See SETUP.md.
name = "wander-media"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

# The Worker answers everything on your media host.
# (If the R2 bucket has its own custom domain on this host, remove it first:
# the bucket then has no public address; only this Worker and your rclone key reach it.)
routes = [
  { pattern = "media.example.com", custom_domain = true }
]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "trip-media"

[vars]
# Comma-separated origins of your site(s). They may read trips with the Access
# cookie (CORS with credentials), and sign-in only sends people back to them.
# The first one is the default place to send people after sign-in.
SITE_ORIGINS = "https://wander.example.com"

# Favourites (optional; without these, /<slug>/favorites answers 500 and sites hide
# their hearts). Your Zero Trust team domain, and each trip's Access app AUD tag:
# `python tripmap/access.py list <slug>` prints it. Add a line per trip, then deploy.
# Also a secret salt, never in this file. See SETUP.md step 9.
# ACCESS_TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
# ACCESS_AUD = { "lisbon-2025" = "<the lisbon-2025 app's AUD tag>" }
