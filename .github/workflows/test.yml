name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tripmap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python -m unittest discover tripmap/tests

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: cd worker && npm test
